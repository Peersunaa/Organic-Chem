<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene assets: coords and glyphs</title>
<!-- Dev page for the scene groundwork. It needs a web server (it loads coords.json and glyphs.js):
       cd learn && python -m http.server 8123      then open http://localhost:8123/scenes/demo.html
     ?r=alkene-hx picks a reaction, ?theme=dark starts dark. Nothing here is part of the app. -->
<style>
  :root {
    --bg: #f2f5f5; --surface: #ffffff; --surface-2: #eaf0f1; --ink: #0c1d23; --ink-2: #344a51; --muted: #4f666d;
    --line: #d9e3e5; --line-strong: #b6c7cb; --accent: #0a727c; --bad: #b23a26; --electron: #cf7f00;
  }
  :root[data-theme="dark"] {
    --bg: #090f12; --surface: #0f171b; --surface-2: #141f24; --ink: #e8f1f3; --ink-2: #b6c8cd; --muted: #8aa0a7;
    --line: #1d2c32; --line-strong: #30454d; --accent: #4fd1d4; --bad: #f58f7c; --electron: #f2b33d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 28px 0 10px; color: var(--ink-2); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 6px; }
  button, select { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { color: var(--muted); font-size: .85rem; display: inline-flex; gap: 6px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px; }
  .card h3 { margin: 2px 4px 2px; font-size: .9rem; }
  .card p { margin: 0 4px 6px; font-size: .78rem; color: var(--muted); min-height: 2.2em; }
  svg { width: 100%; height: auto; display: block; background: var(--surface-2); border-radius: 8px; }
  .glyphs { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .err { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<h1>Scene assets: coords.json and glyphs.js</h1>
<div class="bar">
  <button id="theme" type="button" aria-pressed="false">Dark mode</button>
  <label>Reaction <select id="rx"></select></label>
  <label><input type="checkbox" id="movers" checked> ring the movers</label>
  <label><input type="checkbox" id="maps"> show atom-map numbers</label>
  <label><input type="checkbox" id="stat"> static glyphs (reduced motion)</label>
</div>
<p id="msg" class="err"></p>
<h2 id="h-stages">Stages</h2>
<div class="grid" id="stages"></div>
<h2>Glyphs, one of each (a 440 x 200 crop of the 640 x 400 scene)</h2>
<div class="grid glyphs" id="glyphs"></div>

<script type="module">
import * as G from './glyphs.js';

const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const qs = new URLSearchParams(location.search);
if (qs.get('theme') === 'dark') root.dataset.theme = 'dark';
const syncBtn = () => { const d = root.dataset.theme === 'dark'; $('theme').textContent = d ? 'Light mode' : 'Dark mode'; $('theme').setAttribute('aria-pressed', String(d)); };
$('theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; syncBtn(); };
syncBtn();

const BOND = 44, W = 640, H = 400;
const f = (v) => Math.round(v * 10) / 10;
const LABEL_GAP = 11;

// ---- structure renderer (coords.json stage -> svg string)
function renderStage(st, opts = {}) {
  const atoms = st.atoms;
  const labelled = (a) => a.sym !== 'C';
  const pos = (i) => atoms[i];
  const shorten = (a, b) => {
    // pull the end of the line at `a` back when a is drawn as a label
    if (!labelled(a)) return [a.x, a.y];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
    return [a.x + (dx / L) * LABEL_GAP, a.y + (dy / L) * LABEL_GAP];
  };
  let out = '';
  for (const bd of st.bonds) {
    const A = pos(bd.a), B = pos(bd.b);
    const [x1, y1] = shorten(A, B), [x2, y2] = shorten(B, A);
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const line = (ox, oy, extra = '') => `<line x1="${f(x1 + nx * ox)}" y1="${f(y1 + ny * oy)}" x2="${f(x2 + nx * ox)}" y2="${f(y2 + ny * oy)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" ${extra}/>`;
    if (bd.stereo === 'wedge' || bd.stereo === 'dash') {
      const w = 6;
      const px = x1 + nx * 0, py = y1 + ny * 0;
      if (bd.stereo === 'wedge') {
        out += `<polygon points="${f(px)},${f(py)} ${f(x2 + nx * w)},${f(y2 + ny * w)} ${f(x2 - nx * w)},${f(y2 - ny * w)}" fill="var(--ink)"/>`;
      } else {
        for (let k = 1; k <= 5; k++) {
          const t = k / 5.5, cx = x1 + dx * t, cy = y1 + dy * t, hw = 1 + 5 * t;
          out += `<line x1="${f(cx + nx * hw)}" y1="${f(cy + ny * hw)}" x2="${f(cx - nx * hw)}" y2="${f(cy - ny * hw)}" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>`;
        }
      }
    } else if (bd.order === 2) { out += line(-3.2, -3.2) + line(3.2, 3.2); }
    else if (bd.order === 3) { out += line(0, 0) + line(-5, -5) + line(5, 5); }
    else out += line(0, 0);
  }
  for (const a of atoms) {
    if (opts.movers && a.mv) out += `<circle cx="${a.x}" cy="${a.y}" r="15" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="3 3"/>`;
    if (a.sym === 'C') {
      if (a.charge) out += `<text x="${a.x + 7}" y="${a.y - 6}" font-size="15" font-weight="700" fill="var(--accent)">${a.charge > 0 ? '+' : '−'}</text>`;
    } else {
      const small = a.sym === 'H';
      const r = small ? 8 : 11;
      out += `<circle cx="${a.x}" cy="${a.y}" r="${r}" fill="var(--surface-2)"/>`;
      out += `<text x="${a.x}" y="${f(a.y + (small ? 4.5 : 5.5))}" text-anchor="middle" font-size="${small ? 13 : 17}" font-weight="${small ? 500 : 700}" fill="var(--ink)">${a.sym}</text>`;
      if (a.charge) out += `<text x="${a.x + 9}" y="${a.y - 6}" font-size="14" font-weight="700" fill="var(--accent)">${a.charge > 0 ? '+' : '−'}</text>`;
    }
    if (opts.maps) out += `<text x="${a.x - 4}" y="${a.y + 22}" font-size="11" fill="var(--muted)">${a.map}</text>`;
  }
  return out;
}

const svg = (inner, extra = '', vb = `0 0 ${W} ${H}`) => `<svg viewBox="${vb}" role="img" ${extra}>${inner}</svg>`;

let COORDS = null;
function draw() {
  const rid = $('rx').value;
  history.replaceState(null, '', `?r=${rid}${root.dataset.theme === 'dark' ? '&theme=dark' : ''}`);
  const rx = COORDS[rid];
  const names = Object.keys(rx);
  $('h-stages').textContent = `Stages: ${rid} (${names.length}); scale ${COORDS._meta.scales[rid]} px per bond`;
  $('stages').innerHTML = names.map((n) => {
    const st = rx[n];
    return `<div class="card"><h3>${n}</h3><p>${st.note || ''}</p>${svg(renderStage(st, { movers: $('movers').checked, maps: $('maps').checked }), `aria-label="${rid} ${n}"`)}</div>`;
  }).join('');
}

function drawGlyphs() {
  const s = $('stat').checked;
  const mol = (a, b, c, d) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
  const dot = (x, y, t = 'C') => `<circle cx="${x}" cy="${y}" r="11" fill="var(--surface-2)"/><text x="${x}" y="${y + 5.5}" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${t}</text>`;
  const items = [
    ['piCloud (both)', mol(240, 200, 330, 200) + mol(240, 202.6, 330, 202.6) + G.piCloud(240, 200, 330, 200)],
    ['piCloud (top, tilted)', mol(230, 230, 330, 170) + G.piCloud(230, 230, 330, 170, { side: 'top' })],
    ['pOrbital (filled) and empty', mol(200, 200, 280, 200) + G.pOrbital(280, 200, -90) + G.pOrbital(360, 200, -90, { empty: true }) + dot(360, 200)],
    ['lonePair', dot(320, 200, 'O') + G.lonePair(320, 200, -90) + G.lonePair(320, 200, 30) ],
    ['sigmaStar (backside lobe)', mol(300, 200, 400, 200) + dot(300, 200) + dot(400, 200, 'Br') + G.sigmaStar(300, 200, 400, 200)],
    ['bromonium', mol(260, 240, 380, 240) + mol(260, 240, 320, 140) + mol(380, 240, 320, 140) + G.bromonium(260, 240, 380, 240, 320, 140) + dot(320, 140, 'Br')],
    ['surface (Pd) with H atoms', G.surface(250, 400, { x: 120 })],
    ['facesLabel', mol(240, 200, 400, 200) + G.facesLabel(320, 200)],
    ['electronPair on a curved path', (() => { const d = G.arrowPathD(220, 230, 420, 230, -50); return `<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 5"/>` + dot(220, 230) + dot(420, 230) + G.electronPair(d, { static: s }); })()],
    ['curvedArrow (bulge +, -)', dot(220, 220) + dot(420, 220) + G.curvedArrow(220, 205, 420, 205, { bulge: -40 }) + G.curvedArrow(420, 238, 220, 238, { bulge: -35, color: 'accent' })],
    ['bondGhost forming / breaking', dot(180, 160) + dot(320, 160) + G.bondGhost(190, 160, 310, 160, { state: 'forming', static: s }) + dot(320, 250) + dot(460, 250, 'Br') + G.bondGhost(330, 250, 448, 250, { state: 'breaking', static: s })]
  ];
  $('glyphs').innerHTML = items.map(([t, inner]) => `<div class="card"><h3>${t}</h3>${svg(inner, `aria-label="${t}"`, '100 100 440 200')}</div>`).join('');
}

try {
  COORDS = await (await fetch('./coords.json')).json();
  const ids = Object.keys(COORDS).filter((k) => k !== '_meta');
  $('rx').innerHTML = ids.map((k) => `<option value="${k}">${k}</option>`).join('');
  $('rx').value = ids.includes(qs.get('r')) ? qs.get('r') : 'alkene-hx';
  $('rx').onchange = draw; $('movers').onchange = draw; $('maps').onchange = draw; $('stat').onchange = drawGlyphs;
  $('theme').addEventListener('click', draw);
  draw();
} catch (e) {
  $('msg').textContent = 'Could not load coords.json (' + e.message + '). Serve the learn/ folder over http, see the comment at the top of this file.';
}
drawGlyphs();
</script>
</body>
</html>
