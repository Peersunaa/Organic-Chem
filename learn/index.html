/* Design tokens (wave D1). One set for every screen: colour layers, ink levels, hairlines, semantic signals; a 4px spacing scale; a type scale with fixed line-heights; radius, elevation and motion tokens; one focus ring.
   Old names (--bg --surface --ink --muted --line --accent --ok --bad --electron --c-X --r --shadow) still work. Learning signal: teal = your move / explanation, green = right, coral = wrong, amber = hint, blue = definition. */
:root {
  /* colour, light (designed on paper-white, not inverted from dark) */
  --bg: #f2f5f5; --bg-2: #e9eff0; --surface: #ffffff; --surface-2: #eaf0f1; --surface-3: #dde7e9;
  --ink: #0c1d23; --ink-2: #344a51; --muted: #4f666d;

  --bad: #b23a26; --bad-soft: rgba(178, 58, 38, .09); --bad-line: rgba(178, 58, 38, .40);
  --hint: #8a5200; --hint-soft: rgba(207, 127, 0, .12); --hint-line: rgba(207, 127, 0, .45);

  --electron: #cf7f00;
  --c-O: #d1432b; --c-N: #2d5bd0; --c-F: #1b8f8f; --c-Cl: #1e8e4e; --c-P: #9a3bc4; --hl: rgba(242, 179, 61, .5);
  --model-bg: #c9d7db;
  /* elevation: two levels */

  --elev-2: 0 1px 2px rgba(12, 29, 35, .05), 0 12px 32px -10px rgba(12, 29, 35, .16);
  --shadow: var(--elev-1);
  /* fonts */
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  /* 4px spacing scale */

}

:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* header: brand left, the two naming/voice switches as one segmented group */

/* home */
.hero { display: grid; gap: var(--s-4); padding-block: var(--s-6) var(--s-2); justify-items: start; }
.eyebrow { font: 500 var(--fs-label)/var(--lh-label) var(--mono); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--accent); }
h1 { font: 700 var(--fs-display)/var(--lh-display) var(--display); letter-spacing: var(--tr-display); text-wrap: balance; }
.lede { max-width: 52ch; color: var(--ink-2); font-size: 1.0625rem; line-height: 1.75rem; }
.cols { display: grid; gap: var(--s-8); min-width: 0; }
@media (min-width: 900px) { .wrap { max-width: 1060px; } .cols { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }

.locked .num { color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: var(--s-1); font: 500 var(--fs-label)/var(--lh-label) var(--mono); letter-spacing: .02em; padding: var(--s-1) var(--s-2); border-radius: var(--r-sm); background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* lesson player */
.mastery-passed { margin-bottom: var(--s-3); }
.recap-slot:empty { display: none; } .recap-slot { margin-bottom: var(--s-4); }
.recap { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r-xs) var(--r-md) var(--r-md) var(--r-xs); background: var(--surface-2); padding: 0 var(--s-4); }
.recap summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font: 600 var(--fs-label)/var(--lh-label) var(--mono); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--accent); }
.recap-body { display: grid; gap: 6px; padding-bottom: var(--s-3); font-size: .9375rem; line-height: 1.375rem; }
.recap-q { color: var(--muted); } .recap-a b { color: var(--ink); } .recap-note p { margin: 0; display: inline; } .recap-note p + p::before { content: ' '; }
.recap-body:not(.full) .recap-q { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.recap-body:not(.full) .recap-note { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7; overflow: hidden; }
.recap-more { justify-self: start; background: none; border: 0; padding: 0; min-height: 44px; color: var(--accent); font-weight: 600; font-size: var(--fs-small); cursor: pointer; }
.mol.mol-inline { display: inline-grid; vertical-align: middle; margin: 0 .2em; width: auto; } .mol-inline .mol-svg { width: 110px; max-width: 110px; }
.recap .mol { display: inline-grid; vertical-align: middle; } .recap .mol-svg { max-width: 110px; }
/* the key idea of an explain step (it may hold drawings, rows of equations, lists): every paragraph is its own row that wraps inside the card, never runs into the next (novice review 2026-10-20, #4) */
.recap-body { grid-template-columns: minmax(0, 1fr); min-width: 0; } .recap-body > * { min-width: 0; }
.recap-note.idea { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.recap-body:not(.full) .recap-note.idea { display: grid; -webkit-line-clamp: none; max-height: 12rem; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent); }   /* a long key idea is cut at about eight lines, with Show all (novice re-test #4) */
.recap-note.idea p { display: block; margin: 0; } .recap-note.idea p + p::before { content: none; }
.recap-note.idea :is(ol, ul) { margin: 0; padding-left: 1.25rem; display: grid; gap: 4px; }
.recap-note.idea span[style*="nowrap"] { max-width: 100%; white-space: normal !important; }
.recap-note.idea .mol { vertical-align: middle; max-width: 100%; } .recap-note.idea .mol-svg { max-width: 84px; }   /* smaller drawings: the recap is a reminder, the full-size step is one tap back */

/* figure cards: the chapter's crafted "See the idea" figure (lesson top, hub group header); the SVG is inlined, so the tokens reach it */
.fig-card { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r-xs) var(--r-md) var(--r-md) var(--r-xs); background: var(--surface-2); padding: 0 var(--s-4); min-width: 0; margin-bottom: var(--s-4); }
.fig-card > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: var(--s-2); list-style: none; font: 600 var(--fs-label)/var(--lh-label) var(--mono); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--accent); }
.fig-card > summary::-webkit-details-marker { display: none; }
.fig-card > summary::before { content: ''; flex: none; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(-45deg); transition: transform var(--dur-fast) var(--ease-out); }
.fig-card[open] > summary::before { transform: translateY(-2px) rotate(45deg); }
.fig-card > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
.fig-body { padding-bottom: var(--s-4); }
.fig-frame { width: 100%; aspect-ratio: 8 / 5; max-height: 60vh; display: grid; place-items: center; overflow: hidden; border-radius: var(--r-md); }
.fig-frame > svg { display: block; width: 100%; height: 100%; max-height: 60vh; }
.fig-frame.is-text { aspect-ratio: auto; max-height: none; }
.fig-pan { display: none; margin: var(--s-2) 0 0; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--muted); }
.fig-frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 599px) {
  .fig-frame { display: block; place-items: start; justify-items: start; aspect-ratio: auto; max-height: none; overflow-x: auto; overflow-y: hidden; touch-action: pan-x pan-y; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .fig-frame > svg { width: 560px; min-width: 560px; height: auto; max-height: none; aspect-ratio: 8 / 5; }
  .fig-frame.is-text { overflow: visible; }
  .fig-card[open] .fig-pan { display: block; }
}
.fig-fallback { margin: 0; color: var(--muted); font-size: var(--fs-small); line-height: var(--lh-small); } .fig-fallback b { color: var(--ink); }
.hub-ghead .fig-card { margin: var(--s-2) 0 0; }
.fb-lead { margin: 0; font-weight: 600; } .fb-more { margin-top: var(--s-2); } .fb-more > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--accent); } .fb-more > p { margin: 0 0 var(--s-2); }
.fb-links { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-2) 0 0; }
.hub-xlink { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.hub-da { margin: 0; padding: var(--s-2); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); } .hub-da-svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; color: var(--ink); }
.hub-draw { display: grid; gap: var(--s-1); } .hub-draw-h { margin: 0; font-weight: 600; color: var(--accent); }
.lhead { display: grid; gap: var(--s-3); }
.back-home { font-size: var(--fs-small); line-height: var(--lh-small); text-decoration: none; justify-self: start; min-height: 44px; display: inline-flex; align-items: center; color: var(--muted); transition: color var(--dur-fast) var(--ease-out); } .back-home:hover { color: var(--ink); }

.ltitle .num { font-size: var(--fs-label); line-height: var(--lh-label); padding: var(--s-1) 6px; border: 1px solid var(--accent-line); border-radius: var(--r-sm); flex: none; align-self: center; letter-spacing: .02em; }

@media (min-width: 640px) { .card { padding: var(--s-8); } }

.step.enter { animation: rise var(--dur-base) var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.prompt { font: 700 clamp(1.125rem, 1rem + 1vw, 1.375rem)/1.35 var(--display); letter-spacing: var(--tr-heading); text-wrap: pretty; }
.foot { display: flex; justify-content: space-between; gap: var(--s-3); }
.foot .primary { margin-left: auto; min-width: 140px; }

/* options + feedback */
.opts { display: grid; gap: var(--s-2); } .opts.mols { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt { position: relative; text-align: left; min-height: 52px; padding: var(--s-3) var(--s-4); border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; display: flex; align-items: center; touch-action: manipulation; transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), transform var(--dur-hover) var(--ease-out); }
.opts:not(.mols) .opt { padding-right: 44px; }

.opt:active:not(:disabled) { transform: scale(.992); }

.opt.bad::after { width: 12px; height: 12px; margin-top: -6px; background: linear-gradient(45deg, transparent 43%, var(--bad) 43% 57%, transparent 57%), linear-gradient(-45deg, transparent 43%, var(--bad) 43% 57%, transparent 57%); }
@keyframes mark-in { from { opacity: 0; } to { opacity: 1; } }
.opts .mol { margin: 0 auto; }
.fb { display: block; border-radius: var(--r-md); padding: var(--s-3) var(--s-4); border: 1px solid transparent; border-left-width: 3px; color: var(--ink); animation: fb-in var(--dur-base) var(--ease-out) both; }
.fb:empty { display: none; }
.step > .fb, .problem > .fb { min-height: var(--fb-reserve); }
.step > .fb:empty, .problem > .fb:empty { display: block; visibility: hidden; animation: none; }
.fb p { padding: 0; }
.fb.ok { background: var(--ok-soft); border-color: var(--ok-line); border-left-color: var(--ok); } .fb.bad { background: var(--bad-soft); border-color: var(--bad-line); border-left-color: var(--bad); }
@keyframes fb-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.hints { display: grid; gap: var(--s-2); }
.hint { background: var(--hint-soft); border: 1px solid var(--hint-line); border-left: 3px solid var(--hint); border-radius: var(--r-xs) var(--r-md) var(--r-md) var(--r-xs); padding: var(--s-3) var(--s-4); animation: fb-in var(--dur-base) var(--ease-out) both; }
.hint b { color: var(--hint); }
.worked-box, .reveal, .rule { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r-xs) var(--r-md) var(--r-md) var(--r-xs); padding: var(--s-3) var(--s-4); }
.worked-box b, .reveal b, .rule b { color: var(--accent); }
.worked-box, .reveal { animation: fb-in var(--dur-base) var(--ease-out) both; }
.reveal { margin-top: var(--s-3); } .after { display: grid; gap: 0; min-height: 8.5rem; align-content: start; }
@media (max-width: 460px) { .after { min-height: 11.5rem; } }
.explain { display: grid; gap: var(--s-3); font-size: 1.0625rem; line-height: 1.75rem; } .explain b { color: var(--accent); }
.ans-row { display: flex; gap: var(--s-3); flex-wrap: wrap; }
.ans { flex: 1; min-width: 140px; min-height: 48px; padding: var(--s-2) var(--s-4); border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--bg-2); font: 600 1.0625rem var(--mono); transition: border-color var(--dur-fast) var(--ease-out); }
.ans:hover:not(:disabled) { border-color: var(--line-hover); } .ans:focus-visible { border-color: var(--accent); }
.ans:disabled { opacity: .6; }
.moves { display: grid; gap: var(--s-4); } .move { display: grid; gap: var(--s-3); padding-top: var(--s-4); border-top: 1px solid var(--line); } .move:first-child { border: 0; padding: 0; }
.ask { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-2); } .useit { display: grid; gap: var(--s-4); } .useit .chip { font-size: .875rem; line-height: 1rem; background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); padding: var(--s-2) var(--s-3); }
h3 { font: 600 var(--fs-label)/var(--lh-label) var(--mono); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--muted); }
.problem { display: grid; gap: var(--s-4); } .stage { display: grid; gap: var(--s-4); }
.count { margin-bottom: -6px; }
.mol { margin: 0; display: grid; justify-items: center; gap: var(--s-1); color: var(--ink); }
.mol-svg { width: 100%; max-width: var(--mol-figure); } .mol-svg svg { width: 100%; height: auto; display: block; }
.mol figcaption { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--muted); }
.widget, .visual { display: grid; gap: var(--s-3); min-width: 0; }
.iupac { font-weight: 600; }

/* Widget primitives (wave D2). Every widget below composes these, so a card, a note, a message, a stage and a figure caption look the same wherever they appear.
   card = a tappable choice (the shell's .opt, smaller); note = a teal-edged explanation; message = right (green) or wrong (coral), like .fb; stage = the surface a drawing sits on; info = a quiet box that groups a result. */
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, .sg-cell, .rf-salt) { position: relative; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); color: var(--ink); font: inherit; text-align: center; transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), transform var(--dur-hover) var(--ease-out); }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, button.sg-cell, .rf-salt) { cursor: pointer; touch-action: manipulation; }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, button.sg-cell, .rf-salt):hover:where(:not(:disabled, .ghost)) { border-color: var(--accent-line); background: var(--surface-2); }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, button.sg-cell, .rf-salt):active:where(:not(:disabled, .ghost)) { transform: scale(.99); }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, .sg-cell, .rf-salt):is([aria-pressed="true"], .on, .sel) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, .sg-cell, .rf-salt):is(.good, .ok, .lock), .cr-card.on { border-color: var(--ok); background: var(--ok-soft); box-shadow: none; color: var(--ink); }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, .sg-cell, .rf-salt).bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: none; }
:is(.rl-opt, .cr-card, .sg-cell).good::after, .cr-card.on::after, .sg-cell.ok::after { content: ''; position: absolute; top: var(--s-3); right: var(--s-3); width: 6px; height: 12px; border: solid var(--ok); border-width: 0 2px 2px 0; transform: rotate(45deg); animation: mark-in var(--dur-base) var(--ease-out) both; }
:is(.rl-opt, .cr-card, .sg-cell, .eq-sp).bad::after { content: ''; position: absolute; top: var(--s-3); right: var(--s-3); width: 12px; height: 12px; background: linear-gradient(45deg, transparent 43%, var(--bad) 43% 57%, transparent 57%), linear-gradient(-45deg, transparent 43%, var(--bad) 43% 57%, transparent 57%); animation: mark-in var(--dur-base) var(--ease-out) both; }
:is(.pm-atom, .eq-sp, .cr-card, .rl-btn, .rl-opt, .rd-thumb, .ds-chip, .sp-card, .rs-chip, button.sg-cell, .rf-salt):disabled { cursor: default; }
.btn.small { min-width: 44px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent-line); }
.btn.bad { border-color: var(--bad); background: var(--bad-soft); } .btn.good { border-color: var(--ok); background: var(--ok-soft); }
/* message: a short verdict inside a widget (the widgets that build a full .fb use that instead) */
:is(.ed-msg, .sp-msg, .cr-msg, .rp-msg, .ds-msg, .sp-verdict).ok { color: var(--ink); background: var(--ok-soft); border: 1px solid var(--ok-line); border-left: 3px solid var(--ok); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); animation: fb-in var(--dur-base) var(--ease-out) both; }
:is(.ed-msg, .sp-msg, .cr-msg, .rp-msg, .ds-msg, .sp-verdict).bad { color: var(--ink); background: var(--bad-soft); border: 1px solid var(--bad-line); border-left: 3px solid var(--bad); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); animation: fb-in var(--dur-base) var(--ease-out) both; }
:is(.ed-msg, .sp-msg, .cr-msg, .rp-msg, .ds-msg):empty { display: none; }
/* note: the why / explanation line of a widget (the same box as .rule and .reveal) */
:is(.mp-why, .mp-label, .mp-changes, .rl-why, .ad-regio, .mp-wi-cmp, .st3-cap, .hub-apply, .pp-steps) { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r-xs) var(--r-md) var(--r-md) var(--r-xs); padding: var(--s-3) var(--s-4); min-width: 0; }
/* stage: the surface a drawing or a diagram sits on */
:is(.lb-svg, .ed-svg, .rp-svg, .sp-stage, .nr-newman, .nr-curve, .eq-row, .ds-tray, .sp-plan) { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); }
/* info: a quiet box that groups one result (a carbocation, an attack site, a step of a plan) */
:is(.rl-cat, .rl-attc, .cl-card, .sp-step, .sg-pick, .rd-find) { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-3); min-width: 0; }
:is(.rl-cat, .rl-attc).fav, .sp-step.bad { border-color: var(--ok-line); } .sp-step.bad { border-color: var(--bad-line); background: var(--bad-soft); }
/* molecule drawings: one width per context (a step's figure, a choice card, a side-by-side pair, a hub example, a small chip), one caption style */
:is(.mol, .cf-fig, .mp-fig, .sg-fig, .rd-fig, .fq-fig, .sp-end) figcaption, .rv-cap, .nr-newman { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--muted); text-align: center; }
:is(.opts, .rl-opts, .cr-grid, .rl-alk, .sp-deck, .rl-cats) .mol-svg, .cr-svg, .rl-btn .rl-svg, .rl-opt .rl-svg { max-width: var(--mol-option); }

/* lesson 04: full <-> skeletal pair, group-finder, skeletal-builder */
.pair { display: flex; align-items: center; justify-content: center; gap: var(--s-2); flex-wrap: wrap; }
.pair .mol { flex: 1 1 var(--mol-side); max-width: var(--mol-figure); } .pair-arrow { font: 700 1.5rem/2rem var(--display); color: var(--accent); }
.gf-stage { position: relative; width: 100%; max-width: var(--mol-stage); margin: 0 auto; color: var(--ink); }
.gf-stage.big { max-width: 380px; } .gf-stage svg { width: 100%; height: auto; display: block; }
/* the tap target is 44px; the ring you see is the ::before circle inside it */
.gf-atom { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; touch-action: manipulation; }
.gf-atom::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 2px solid transparent; transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.gf-atom:hover:not(:disabled)::before { border-color: var(--line-strong); }
.gf-atom[aria-pressed="true"]::before { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.gf-atom.bad::before { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 20%, transparent); }
.gf-atom.lock[aria-pressed="true"]::before { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 22%, transparent); }
.gf-atom:disabled { cursor: default; }
.gf-row { display: flex; gap: var(--s-2); flex-wrap: wrap; } .gf-msg:empty { display: none; }
/* lesson 05: chain-tracer, figure rows */
.gf-atom.ct-chain::before { border: 2px dashed var(--accent); }
.ct-num { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 var(--fs-small)/24px var(--mono); text-align: center; pointer-events: none; animation: ct-pop var(--dur-base) var(--ease-pop) both; }
@keyframes ct-pop { from { opacity: 0; transform: scale(.4); } }
.cip-stage { max-width: var(--mol-stage); }
.cip-ez { display: flex; gap: var(--s-2); } .cip-q { margin: var(--s-1) 0 0; font-weight: 600; }
.cip-ez-btn { min-width: 64px; font: 700 1.125rem/1.5rem var(--mono); }
.cip-ez-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cip-tables { display: grid; gap: var(--s-3); min-width: 0; } .cip-wrap { overflow-x: auto; max-width: 100%; }
.cip-table { border-collapse: collapse; font-size: var(--fs-small); line-height: var(--lh-small); width: 100%; } .cip-table caption { text-align: left; font-weight: 600; padding-bottom: var(--s-1); }
.cip-table th, .cip-table td { border: 1px solid var(--line); padding: var(--s-1) var(--s-2); text-align: left; font-family: var(--mono); white-space: nowrap; } .cip-table thead th { font-family: inherit; background: var(--surface-2); }
.sb-formula { font: 700 clamp(1.25rem, 5vw, 1.5rem)/2rem var(--mono); text-align: center; padding: var(--s-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); overflow-wrap: anywhere; }

/* widgets: Lewis builder, valence strip, polarity marks */
.lb { display: grid; gap: var(--s-3); min-width: 0; }
.lb-svg { width: 100%; max-width: 460px; height: auto; margin: 0 auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.lb-line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.lb-hit { stroke: transparent; stroke-width: 30; stroke-linecap: round; pointer-events: stroke; }
.lb-bond[tabindex] { cursor: pointer; } .lb-bond:focus .lb-line, .lb-bond:hover .lb-line { stroke: var(--accent); }
.lb-disc { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.lb-atom[tabindex] { cursor: pointer; } .lb-atom:hover .lb-disc, .lb-atom:focus .lb-disc { stroke: var(--accent); stroke-width: 2.5; }
.lb-atom.sel .lb-disc { stroke: var(--accent); stroke-width: 3.5; fill: var(--accent-soft); }
.lb-hit-atom { fill: transparent; }
.lb-el { font: 700 17px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lb-lp circle { fill: var(--electron); } .lb-lp { pointer-events: none; }
.lb-lp.pop circle { animation: pop var(--dur-base) var(--ease-pop) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lb-chg { fill: var(--accent); pointer-events: none; } .lb-chgt { font: 700 14px var(--mono); fill: var(--accent-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lb-bar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; padding: var(--s-2) var(--s-3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.lb-sel { font-weight: 600; margin-right: auto; } .lb-charge { display: inline-flex; align-items: center; gap: var(--s-1); } .lb-charge-label { font-size: var(--fs-small); color: var(--muted); margin-right: var(--s-1); }
.lb-help { color: var(--muted); font-size: var(--fs-small); line-height: var(--lh-small); } .lb-actions { display: flex; gap: var(--s-2); justify-content: flex-end; }
.vs { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: var(--s-2); }
.vs-cell { display: grid; justify-items: center; gap: var(--s-1); padding: var(--s-2) var(--s-2) var(--s-3); border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); }
.vs-cell.bad { border-color: var(--bad); background: var(--bad-soft); }
.vs-num { font: 500 var(--fs-label)/var(--lh-label) var(--mono); color: var(--muted); align-self: start; justify-self: start; } .vs-el { font: 700 1.5rem/2rem var(--display); }
.vs-cell input { width: 100%; max-width: 56px; min-height: 44px; text-align: center; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--bg-2); font: 700 1.125rem/1.5rem var(--mono); transition: border-color var(--dur-fast) var(--ease-out); }
.vs-cell input:hover { border-color: var(--line-hover); } .vs-cell input:focus-visible { border-color: var(--accent); }
.pm { display: grid; gap: var(--s-3); width: 100%; } .pm-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); padding: var(--s-3); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.pm-row.bad { border-color: var(--bad); background: var(--bad-soft); }
.pm-atom { min-width: 64px; min-height: 56px; display: grid; justify-items: center; align-content: center; gap: 0; padding: var(--s-1) var(--s-3); }
.pm-sym { font: 700 1.25rem/1.5rem var(--display); } .pm-d { font: 600 var(--fs-small)/var(--lh-small) var(--mono); min-height: var(--lh-small); color: var(--accent); }
.pm-bond { width: 28px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .7; }
.pm-none { min-height: 44px; padding: var(--s-2) var(--s-3); border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: transparent; color: var(--ink); cursor: pointer; font: inherit; font-size: var(--fs-small); margin-left: auto; transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.pm-none:hover { border-color: var(--accent-line); } .pm-none[aria-pressed="true"] { border: 1px solid var(--accent); background: var(--accent-soft); }
.pm-help { flex-basis: 100%; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--muted); }
/* curved-arrow widget (reuses the lb-* atom styles) */
.ad-svg { max-width: 520px; }
.ad-atom, .ad-bond, .ad-lp { outline: none; } .ad-atom, .ad-lp { cursor: pointer; } .ad-bond { cursor: pointer; }
.lb-lp.ad-lp { pointer-events: auto; } .ad-lp .ad-hit-lp { fill: transparent; }
.ad-lp:hover circle:not(.ad-hit-lp), .ad-lp:focus circle:not(.ad-hit-lp) { fill: var(--accent); }
.ad-lp:focus .ad-hit-lp, .ad-atom:focus .lb-disc { stroke: var(--accent); stroke-width: 2.5; }
.ad-lp.ad-src circle:not(.ad-hit-lp) { fill: var(--accent); }
.ad-lp.ad-src .ad-hit-lp { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.ad-bond.ad-src .lb-line { stroke: var(--accent); stroke-width: 5; }
