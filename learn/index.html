<title>Orgo Learn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one calm column (max 760px). Home = hero, then lessons beside weak spots; lesson = progress rail, one step card, back/continue footer. */
:root {
  --bg: #eef3f3; --surface: #fbfdfd; --surface-2: #e4ecee; --ink: #0f2229; --muted: #566c74;
  --line: #d2dde0; --line-strong: #a9bcc2; --accent: #0b7a83; --accent-ink: #ffffff; --accent-soft: #d5ecee;
  --electron: #cf7f00; --ok: #1d7a4b; --ok-soft: #dcf0e4; --bad: #b0422d; --bad-soft: #f8e3dd; --hint-soft: #f7ecd0;
  --c-O: #d1432b; --c-N: #2d5bd0; --c-F: #1b8f8f; --c-Cl: #1e8e4e; --c-P: #9a3bc4; --hl: rgba(242, 179, 61, .5);
  --model-bg: #c9d7db;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 14px; --shadow: 0 1px 2px rgba(15,34,41,.06), 0 8px 24px rgba(15,34,41,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1418; --surface: #121f25; --surface-2: #1a2c34; --ink: #e5f0f2; --muted: #93aab1;
    --line: #243941; --line-strong: #3b5660; --accent: #4fcfd2; --accent-ink: #062226; --accent-soft: #123a40;
    --electron: #f2b33d; --ok: #62cf95; --ok-soft: #133324; --bad: #f1917a; --bad-soft: #3a1d17; --hint-soft: #33290f;
    --c-O: #ff8a70; --c-N: #8fb0ff; --c-F: #5fd6d6; --c-Cl: #6fd79a; --c-P: #d79bf0; --hl: rgba(242, 179, 61, .4);
    --model-bg: #2a4048; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1418; --surface: #121f25; --surface-2: #1a2c34; --ink: #e5f0f2; --muted: #93aab1;
  --line: #243941; --line-strong: #3b5660; --accent: #4fcfd2; --accent-ink: #062226; --accent-soft: #123a40;
  --electron: #f2b33d; --ok: #62cf95; --ok-soft: #133324; --bad: #f1917a; --bad-soft: #3a1d17; --hint-soft: #33290f;
  --c-O: #ff8a70; --c-N: #8fb0ff; --c-F: #5fd6d6; --c-Cl: #6fd79a; --c-P: #d79bf0; --hl: rgba(242, 179, 61, .4);
  --model-bg: #2a4048; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); margin: 0; -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 12px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg :focus-visible { outline: none; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font: 700 1.15rem/1 var(--display); letter-spacing: -.01em; }
.brand svg { color: var(--accent); } .e-dot { fill: var(--electron); }
.switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 8px; min-height: 40px; cursor: pointer; }
.sw-track { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-strong); position: relative; flex: none; }
.sw-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .18s ease; }
.switch[aria-checked="true"] .sw-knob { transform: translateX(14px); background: var(--accent); }
.sw-label { font-size: .85rem; font-weight: 500; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; touch-action: manipulation; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: .9rem; }
.btn.big { min-height: 54px; padding: 12px 28px; font-size: 1.05rem; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

/* home */
.hero { display: grid; gap: 14px; padding-block: 14px 6px; justify-items: start; }
.eyebrow { font: 500 .75rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(2rem, 7vw, 3.1rem)/1.05 var(--display); letter-spacing: -.025em; text-wrap: balance; }
.lede { max-width: 52ch; color: var(--muted); font-size: 1.05rem; }
.cols { display: grid; gap: 22px; min-width: 0; }
@media (min-width: 900px) { .wrap { max-width: 1060px; } .cols { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
h2 { font: 700 1.25rem/1.25 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.lessons { display: grid; gap: 12px; min-width: 0; }
.lesson-list { display: grid; gap: 8px; }
.lesson { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
a.lesson { box-shadow: var(--shadow); } a.lesson:hover { border-color: var(--accent); }
.lesson.locked { background: transparent; border-style: dashed; color: var(--muted); }
.num { font: 700 .95rem/1 var(--mono); color: var(--accent); }
.locked .num { color: var(--muted); }
.ltxt { display: grid; gap: 2px; min-width: 0; }
.ltxt b { font-weight: 600; text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 .75rem/1 var(--mono); padding: 6px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.next { background: var(--accent-soft); color: var(--accent); }
.mini { display: block; height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; } .mini i { display: block; height: 100%; background: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.ws-list { display: grid; gap: 12px; } .ws { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); } .ws:last-child { border: 0; padding: 0; }
.ws-main { display: grid; gap: 2px; min-width: 0; } .ws-last { color: var(--muted); overflow-wrap: anywhere; }
.ws .btn { justify-self: start; }

/* lesson player */
.lhead { display: grid; gap: 10px; }
.back-home { font-size: .9rem; text-decoration: none; justify-self: start; min-height: 32px; display: inline-flex; align-items: center; }
.ltitle { display: flex; align-items: baseline; gap: 12px; font-size: clamp(1.5rem, 5.5vw, 2.1rem); }
.prow { display: flex; align-items: center; gap: 14px; }
.progress { position: relative; flex: 1; height: 4px; background: var(--line); border-radius: 4px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .35s ease; }
.progress b { position: absolute; top: 50%; left: var(--p, 0%); width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--electron); transition: left .35s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: clamp(16px, 4vw, 28px); min-width: 0; }
.step { display: grid; gap: 16px; min-width: 0; }
.step.enter { animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.prompt { font: 600 clamp(1.15rem, 4vw, 1.45rem)/1.3 var(--display); letter-spacing: -.01em; }
.foot { display: flex; justify-content: space-between; gap: 12px; }
.foot .primary { margin-left: auto; min-width: 140px; }

/* options + feedback */
.opts { display: grid; gap: 10px; } .opts.mols { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt { text-align: left; min-height: 52px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; display: flex; align-items: center; touch-action: manipulation; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--ok); background: var(--ok-soft); opacity: 1; }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opts .mol { margin: 0 auto; }
.fb { border-radius: 12px; padding: 0; } .fb:empty { display: none; }
.fb p { padding: 12px 14px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); font-weight: 500; } .fb.bad { background: var(--bad-soft); color: var(--bad); font-weight: 500; }
.fb.bad:not(:has(p)) { padding: 12px 14px; } .fb.ok:not(:has(p)) { padding: 12px 14px; }
.hints { display: grid; gap: 8px; } .hint { background: var(--hint-soft); border-radius: 12px; padding: 10px 14px; }
.worked-box, .reveal, .rule { background: var(--surface-2); border-left: 3px solid var(--electron); border-radius: 4px 12px 12px 4px; padding: 12px 14px; }
.reveal { margin-top: 10px; } .after { display: grid; gap: 0; }
.explain { display: grid; gap: 10px; font-size: 1.05rem; } .explain b { color: var(--accent); }
.ans-row { display: flex; gap: 10px; flex-wrap: wrap; }
.ans { flex: 1; min-width: 140px; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); font: 600 1.1rem var(--mono); }
.ans:disabled { opacity: .6; }
.moves { display: grid; gap: 14px; } .move { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); } .move:first-child { border: 0; padding: 0; }
.ask { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; } .useit { display: grid; gap: 14px; } .useit .chip { font-size: .95rem; background: var(--accent-soft); color: var(--accent); padding: 9px 13px; }
h3 { font: 600 .8rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.problem { display: grid; gap: 14px; } .stage { display: grid; gap: 14px; }
.count { margin-bottom: -6px; }
.mol { margin: 0; display: grid; justify-items: center; gap: 4px; color: var(--ink); }
.mol-svg { width: 100%; max-width: 230px; } .mol-svg svg { width: 100%; height: auto; display: block; }
.mol figcaption { font-size: .85rem; color: var(--muted); }
.widget, .visual { display: grid; gap: 12px; min-width: 0; }
.iupac { font-weight: 600; }

/* widgets */
.lb { display: grid; gap: 10px; min-width: 0; }
.lb-svg { width: 100%; max-width: 460px; height: auto; margin: 0 auto; display: block; background: var(--surface-2); border-radius: 14px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.lb-line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.lb-hit { stroke: transparent; stroke-width: 30; stroke-linecap: round; pointer-events: stroke; }
.lb-bond[tabindex] { cursor: pointer; } .lb-bond:focus .lb-line, .lb-bond:hover .lb-line { stroke: var(--accent); }
.lb-disc { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.lb-atom[tabindex] { cursor: pointer; } .lb-atom:hover .lb-disc, .lb-atom:focus .lb-disc { stroke: var(--accent); stroke-width: 2.5; }
.lb-atom.sel .lb-disc { stroke: var(--accent); stroke-width: 3.5; fill: var(--accent-soft); }
.lb-hit-atom { fill: transparent; }
.lb-el { font: 700 17px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lb-lp circle { fill: var(--electron); } .lb-lp { pointer-events: none; }
.lb-lp.pop circle { animation: pop .3s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lb-chg { fill: var(--accent); pointer-events: none; } .lb-chgt { font: 700 14px var(--mono); fill: var(--accent-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.lb-sel { font-weight: 600; margin-right: auto; } .lb-charge { display: inline-flex; gap: 4px; }
.lb-help { color: var(--muted); font-size: .88rem; } .lb-actions { display: flex; gap: 10px; justify-content: flex-end; }
.vs { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 8px; }
.vs-cell { display: grid; justify-items: center; gap: 4px; padding: 8px 6px 10px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); }
.vs-cell.bad { border-color: var(--bad); background: var(--bad-soft); }
.vs-num { font: 500 .7rem var(--mono); color: var(--muted); align-self: start; justify-self: start; } .vs-el { font: 700 1.5rem var(--display); }
.vs-cell input { width: 100%; max-width: 54px; min-height: 44px; text-align: center; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--bg); font: 700 1.1rem var(--mono); }
.pm { display: grid; gap: 10px; width: 100%; } .pm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
.pm-row.bad { border-color: var(--bad); background: var(--bad-soft); }
.pm-atom { min-width: 64px; min-height: 56px; display: grid; justify-items: center; align-content: center; gap: 0; padding: 4px 12px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; }
.pm-atom[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pm-sym { font: 700 1.3rem var(--display); } .pm-d { font: 600 .85rem var(--mono); min-height: 1.1em; color: var(--accent); }
.pm-bond { width: 28px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .7; }
.pm-none { min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 1.5px dashed var(--line-strong); background: transparent; color: var(--ink); cursor: pointer; font: inherit; font-size: .9rem; margin-left: auto; }
.pm-none[aria-pressed="true"] { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.pm-help { flex-basis: 100%; font-size: .8rem; color: var(--muted); }
.pm-atom:focus-visible, .pm-none:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.m3 { display: grid; gap: 10px; } .m3-views { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.m3-view { position: relative; width: 100%; height: 260px; border-radius: 14px; background: var(--model-bg); overflow: hidden; touch-action: none; }
.m3-fb { display: grid; place-items: center; background: var(--model-bg); border-radius: 14px; padding: 12px; }
.m3-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .m3-note { color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app" aria-live="off"><p class="muted" style="padding:24px 16px">Loading Orgo Learn…</p></div>
<script type="module" src="app.js"></script>
